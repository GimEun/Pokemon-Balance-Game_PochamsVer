<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>포켓몬 밸런스 게임</title>
<style>
  :root{
    --bg:#E2DED0; --frame:#3B6CB2; --navy:#1B2A4A;
    --gold:#F4B740; --orange:#F28C28; --cream:#FFF9EC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--navy)}
  .app{max-width:1180px;min-height:90vh;margin:20px auto;padding:22px;border:3px solid var(--frame);border-radius:14px;background:var(--bg);display:flex;flex-direction:column}
  h1{font-weight:900;margin:0 0 10px}
  .btn{cursor:pointer;border:2px solid var(--navy);background:var(--cream);color:var(--navy);font-weight:800;padding:10px 18px;border-radius:10px;font-size:15px;margin:4px}
  .btn:hover{background:#fff}
  .btn.primary{background:var(--navy);color:#fff}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
  .title-q{font-weight:900;font-size:24px;text-align:center;color:var(--navy);margin:14px 0}
  .board{display:grid;grid-template-columns:1fr 80px 1fr;gap:14px;align-items:stretch;margin-top:10px}
  .card{background:var(--navy);color:#fff;border-radius:22px;padding:14px;position:relative;cursor:pointer}
  .card h2{margin:4px;font-size:20px;color:var(--gold);text-align:center}
  .mid{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:8px}
  .mid img{width:140px;height:140px;object-fit:contain;background:#ffffff22;border-radius:14px}
  .stat{display:grid;grid-template-columns:48px 1fr 30px;gap:6px;align-items:center;font-size:12px}
  .bar{height:8px;background:#ffffff22;border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:#7fb1ff}
  .bar.ev>i{background:var(--orange)}
  .info{padding:6px 12px;font-size:12.5px;line-height:1.5}
  .info span{color:var(--gold);font-weight:700}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px}
  .mv{background:#0f1a34;border:1px dashed #ffffff55;border-radius:8px;padding:6px;text-align:center;font-size:12px}
  .mv.first{border-color:var(--gold);color:var(--gold)}
  .vs{align-self:center;background:#fff;border:2px dashed var(--navy);border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-weight:900;margin:auto}
  .banner{margin:16px auto;padding:14px;border-radius:14px;text-align:center;font-weight:900;font-size:20px}
  .banner.ok{background:#e7f6e7;color:#2c7d2c;border:2px solid #2c7d2c}
  .banner.no{background:#fdecec;color:#a02020;border:2px solid #a02020}
  .explain{background:var(--cream);border:2px solid var(--navy);border-radius:14px;padding:14px;margin:10px 0;font-size:13px;white-space:pre-wrap;font-family:monospace}
  .landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh;text-align:center;padding:40px 20px}
  .instr{max-width:800px;margin:auto;background:var(--cream);border:2px solid var(--navy);border-radius:14px;padding:22px;line-height:1.75;font-size:14.5px;text-align:left}
  .instr h3{margin:14px 0 6px;color:var(--navy)}
  .globalstate{max-width:820px;margin:10px auto 0;background:#fff5df;border:2px dashed var(--orange);border-radius:12px;padding:8px 12px;text-align:center;font-weight:800;color:var(--navy);font-size:13px}
  @media (max-width: 800px){ .board{grid-template-columns:1fr} }
</style>
</head>

function moveInfo(name){
  const isStatus = /변화|저주|고백|회복|고속|성장|순풍|날려|방어|가루|춤|씨뿌리|광합성|맹독|자석파|도깨비|명상|하품|도발|스텔스|철벽|게으름|트릭|길동무|앵코르|멸망|날개쉬기|껍질|미러코트|눈초리|압정|나누기|대타|헛기침|악몽|모닝썬|미채|스핀|벌크|최면|디펜스|킹실드|희망|배북|아쿠아링|리플렉터|바톤|울부|애교|장막|카운터|안개|추억/.test(name);
  if(isStatus) return { bp: 0, type: "노말", cat: "변화", name }; 
  
  const isPhysical = /펀치|킥|엄니|태클|물리|찌르|헤드|볼트|날개|드릴|폭포|잎|바위|이판사판|인파이트|신속|지진|크로스|유턴|탁쳐|메가혼|스톤|블라스트|기관총|바늘|속이다|기습|떨구기|다이브|클로|프레스|절이|치근|야습|역린|폭포오르기|아쿠아제트|은혜갚기|마하|안다리|무릎차기|브레이브|제비반환|애크러뱃|성스러운칼/.test(name);
  
  let type = "노말";
  if(/불|화염|플레어|오버히트|분화|대문자|송|원념/.test(name)) type = "불꽃";
  else if(/물|파도|폭포|아쿠아|하이드로|열탕|거품|수리검|다이빙/.test(name)) type = "물";
  else if(/풀|잎|씨|광합성|기가|우드|리프|에너지볼|플라워|개척/.test(name)) type = "풀";
  else if(/전|볼트|10만|벼락|번개|와일드/.test(name)) type = "전기";
  else if(/얼음|블리자드|냉동|눈보라|고드름|뭉치|프리즈|악셀/.test(name)) type = "얼음";
  else if(/격투|파동탄|인파이트|드레인|엄청난|무릎|마하|안다리|바디프레스|성스러운/.test(name)) type = "격투";
  else if(/독|헤도로|오물|더스트|클리어스모그/.test(name)) type = "독";
  else if(/땅|지진|드릴|대지|진흙/.test(name)) type = "땅";
  else if(/바위|돌|파워젬|스톤에지|블라스트|소금/.test(name)) type = "바위";
  else if(/벌레|메가혼|유턴|야단법석|벌레먹음/.test(name)) type = "벌레";
  else if(/고스트|섀도|야습|다이브|꿰매기/.test(name)) type = "고스트";
  else if(/악|깨물|탁쳐|기습|파동|속임수|나이트|재앙/.test(name)) type = "악";
  else if(/강철|아이언|헤비봄버|스마트혼|러스터|코멧|불릿/.test(name)) type = "강철";
  else if(/페어리|샤인|문포스|플레이러프|플레임|치근거리기/.test(name)) type = "페어리";
  else if(/드래곤|용|역린|애로/.test(name)) type = "드래곤";
  else if(/에스퍼|사이코|신통력|사념|사념의/.test(name)) type = "에스퍼";
  else if(/비행|공중|폭풍|에어|브레이브|제비|애크러뱃/.test(name)) type = "비행";

  return { bp: 80, type, cat: isPhysical ? "물리" : "특수", name };
}

function parsePipeMap(raw, parser){
  const out={};
  raw.split(/\r?\n/).forEach(line=>{
    const idx = line.indexOf("|");
    if(idx === -1) return;
    const k = line.substring(0, idx).trim();
    const rest = line.substring(idx + 1).trim();
    out[k] = parser ? parser(rest) : rest;
  });
  return out;
}

    if(isPhysical) {
      if(isFast) return {role:"고속물리어태커", ev:{HP:2,공격:32,방어:0,특공:0,특방:0,스피드:32}, natures:["명랑","고집"], isAttacker:true};
      else return {role:"내구물리어태커", ev:{HP:32,공격:32,방어:0,특공:0,특방:0,스피드:2}, natures:["고집","용감"], isAttacker:true};
    } else {
      if(isFast) return {role:"고속특공어태커", ev:{HP:2,공격:0,방어:0,특공:32,특방:0,스피드:32}, natures:["겁쟁이","조심"], isAttacker:true};
      else return {role:"내구특공어태커", ev:{HP:32,공격:0,방어:0,특공:32,특방:0,스피드:2}, natures:["조심","냉정"], isAttacker:true};
    }
  } else {
    if(def >= spd) return {role:"물리내구막이", ev:{HP:32,공격:0,방어:32,특공:0,특방:2,스피드:0}, natures:["장난꾸러기","대담"], isAttacker:false};
    else return {role:"특수내구막이", ev:{HP:32,공격:0,방어:2,특공:0,특방:32,스피드:0}, natures:["신중","차분"], isAttacker:false};
  }
}

function calcStats(zeroEvStats, evs, nature){
  const STAT_KEYS = ["HP","공격","방어","특공","특방","스피드"];
  const arr=[];
  STAT_KEYS.forEach((k,i)=>{
    let v = zeroEvStats[i] + (evs[k] || 0);
    if(k !== "HP" && nature && NATURES[nature]){
      if(NATURES[nature].up===k) v = Math.floor(v * 1.1);
      if(NATURES[nature].dn===k) v = Math.floor(v * 0.9);
    }
    arr.push(v);
  });
  return arr;
}

function rankMult(r){ return r>=0 ? (2+r)/2 : 2/(2-r); }

function buildUnit(pkm, difficulty){
  const role = classify(pkm);
  const nature = rnd(role.natures);
  const stats = calcStats(pkm.zeroEvStats, role.ev, nature);
  const item = rnd(ITEMS);
  
  const shuffledMoves = shuffle([...pkm.moves]);
  const dmgFirst = shuffledMoves.find(n => moveInfo(n).cat !== "변화") || shuffledMoves[0];
  const rest = shuffledMoves.filter(n => n !== dmgFirst).slice(0, 3);
  const selectedMoves = [dmgFirst, ...rest];
  
  let rankUp = {공격:0,방어:0,특공:0,특방:0,스피드:0};
  let status = null;

  if(difficulty !== "쉬움"){
    const vars = ["랭크"];
    if(difficulty === "어려움") vars.push("상태");
    
    if(vars.includes("랭크")){
      if(role.isAttacker){
        const k = role.role.includes("특공")?"특공":"공격";
        rankUp[k] = rInt(1,2);
        if(Math.random()<0.5) rankUp["스피드"] = rInt(1,2);
      } else {
        const k = role.role.includes("특수")?"특방":"방어";
        rankUp[k] = rInt(1,2);
      }
    }
    if(vars.includes("상태")){
      const st = rnd(STATUS);
      if(st.n==="화상" && !pkm.types.includes("불꽃")) status = st;
      else if(st.n==="마비" && !pkm.types.includes("전기")) status = st;
    }
  }

  return { pkm, role, nature, stats, item, rankUp, status, moves: selectedMoves };
}

function initRound() {
  let a = rnd(POKEDEX), b = rnd(POKEDEX);
  while(a.name === b.name || classify(a).isAttacker !== classify(b).isAttacker) {
    b = rnd(POKEDEX);
  }

  state.pA = buildUnit(a, state.diff);
  state.pB = buildUnit(b, state.diff);
  
  if(state.diff !== "쉬움" && Math.random() < 0.6) {
    state.field = rnd(FIELDS);
  } else {
    state.field = null;
  }
  
  // [핵심 변경점] 두 포켓몬이 완벽하게 32 노력치를 교집합으로 가지고 있는 스탯만 질문 출제
  let validQs = [4]; // 5번 질문은 고정 포함
  const evA = state.pA.role.ev;
  const evB = state.pB.role.ev;

  if(evA.스피드 === 32 && evB.스피드 === 32) validQs.push(0);
  if(evA.공격 === 32 && evB.공격 === 32) validQs.push(1);
  if(evA.특공 === 32 && evB.특공 === 32) validQs.push(2);
  if(evA.방어 === 32 && evB.방어 === 32) validQs.push(3);

  state.qIdx = rnd(validQs);
  state.result = null;
}

/* ============================================================
   CALCULATION LOGIC
   ============================================================ */
function getSpeed(unit){
  let baseVal = unit.pkm.zeroEvStats[5];
  let realVal = unit.stats[5];
  let v = realVal;
  let log = [`무보정 실수치 ${baseVal} + 스피드 노력치 ${unit.role.ev.스피드} → 실수치(성격 ${unit.nature}): ${realVal}`];

  if(unit.rankUp.스피드){
    const m = rankMult(unit.rankUp.스피드);
    v = Math.floor(v*m);
    log.push(`랭크업(+${unit.rankUp.스피드}): ×${m.toFixed(2)} → ${v}`);
  }
  if(unit.item.n === "구애스카프"){ v = Math.floor(v*1.5); log.push(`구애스카프: ×1.5 → ${v}`); }
  if(unit.status?.n === "마비"){ v = Math.floor(v*0.5); log.push(`마비: ×0.5 → ${v}`); }
  return { val: v, log };
}

function getAtk(unit, kind){
  const idx = kind==="공격"?1:3;
  let baseVal = unit.pkm.zeroEvStats[idx];
  let realVal = unit.stats[idx];
  let v = realVal;
  let log = [`무보정 실수치 ${baseVal} + ${kind} 노력치 ${unit.role.ev[kind]||0} → 실수치(성격 ${unit.nature}): ${realVal}`];

  const r = kind==="공격"?unit.rankUp.공격:unit.rankUp.특공;
  if(r){
    const m = rankMult(r);
    v = Math.floor(v*m);
    log.push(`랭크업(+${r}): ×${m.toFixed(2)} → ${v}`);
  }
  if(kind==="공격" && unit.item.n==="구애머리띠"){ v = Math.floor(v*1.5); log.push(`구애머리띠: ×1.5 → ${v}`); }
  if(kind==="특공" && unit.item.n==="구애안경"){ v = Math.floor(v*1.5); log.push(`구애안경: ×1.5 → ${v}`); }
  if(kind==="공격" && unit.status?.n==="화상"){ v = Math.floor(v*0.5); log.push(`화상 패널티: ×0.5 → ${v}`); }
  return { val: v, log };
}

function getDef(unit, kind = "방어"){
  const idx = kind==="방어"?2:4;
  let baseVal = unit.pkm.zeroEvStats[idx];
  let realVal = unit.stats[idx];
  let v = realVal;
  let log = [`무보정 실수치 ${baseVal} + 방어 노력치 ${unit.role.ev.방어||0} → 실수치(성격 ${unit.nature}): ${realVal}`];

  const r = kind==="방어"?unit.rankUp.방어:unit.rankUp.특방;
  if(r){
    const m = rankMult(r);
    v = Math.floor(v*m);
    log.push(`랭크업(+${r}): ×${m.toFixed(2)} → ${v}`);
  }
  if(state.field?.n === "눈" && kind==="방어" && unit.pkm.types.includes("얼음")){
    v = Math.floor(v*1.5);
    log.push(`눈 날씨(얼음타입): ×1.5 → ${v}`);
  }
  return { val: v, log };
}

function damage(attacker, defender) {
  const mv = moveInfo(attacker.moves[0]);
  let lines = [`【사용 기술】 ${mv.name} (${mv.type}/${mv.cat}, 위력 ${mv.bp})`];
  if(mv.bp === 0 || mv.cat === "변화") return { ko: false, dmg: 0, lines: [...lines, "변화기 → 데미지 0"] };

  const off = getAtk(attacker, mv.cat === "물리" ? "공격" : "특공");
  const def = getDef(defender, mv.cat === "물리" ? "방어" : "특방");
  
  let dmg = Math.floor(Math.floor(Math.floor(2*50/5+2) * mv.bp * off.val / def.val)/50) + 2;

  if(attacker.pkm.types.includes(mv.type)){ dmg = Math.floor(dmg*1.5); lines.push(`자속 보정 ×1.5 → ${dmg}`); }
  const eff = typeEff(mv.type, defender.pkm.types);
  if(eff !== 1){ dmg = Math.floor(dmg*eff); lines.push(`타입 상성 ×${eff} → ${dmg}`); }
  if(mv.cat === "물리" && attacker.status?.n === "화상"){ dmg = Math.floor(dmg*0.5); lines.push(`화상 패널티 ×0.5 → ${dmg}`); }
  if(attacker.item.n === "생명의구슬"){ dmg = Math.floor(dmg*1.3); lines.push(`생명의구슬 ×1.3 → ${dmg}`); }

  const minDmg = Math.floor(dmg * 0.85);
  const hp = defender.stats[0];
  const ko = minDmg >= hp;
  
  lines.push(`예상 데미지: ${minDmg}~${dmg} / 상대방 HP: ${hp}`);
  return { ko, dmg, lines };
}

/* ============================================================
   RENDER UI
   ============================================================ */
function render() {
  const root = document.getElementById('app');
  
  if (state.view === 'landing') {
    root.innerHTML = `
      <div class="landing">
        <h1>포켓몬 밸런스 게임</h1>
        <p>노력치와 성격이 반영된 최종 실수치와 전투 데미지를 계산하여 더 우수한 포켓몬을 맞혀보세요!</p>
        <div class="row">
          <button class="btn primary" onclick="state.view='diff'; render();">난이도 선택</button>
          <button class="btn" onclick="state.view='help'; render();">게임 설명</button>
        </div>
      </div>`;
  } 
  else if (state.view === 'help') {
    root.innerHTML = `
      <div class="instr">
        <h3>🎮 게임 방법</h3>
        상단 질문을 읽고 조건상 우위에 있는 포켓몬 카드를 클릭하세요. 총 20라운드로 진행됩니다.
        <h3>❓ 5가지 질문 유형</h3>
        1) 더 스피드가 빠른 포켓몬은?<br/>
        2) 물리공격력이 더 높은 포켓몬은?<br/>
        3) 특수공격력이 더 높은 포켓몬은?<br/>
        4) 물리내구(방어)가 더 높은 포켓몬은?<br/>
        5) 1번 기술 사용 시 상대를 먼저 기절시키는 포켓몬은?<br>
        <i>* 포켓몬에 공통으로 투자된 노력치(EV)에 대해서만 질문이 출제됩니다!</i>
        <h3>⚔️ 난이도 설정</h3>
        <b>쉬움</b>: 기본 실수치 + 성격 + 도구<br/>
        <b>보통</b>: 랭크업 또는 필드 효과 추가<br/>
        <b>어려움</b>: 랭크업, 필드, 상태이상 조합 적용
        <div style="margin-top:16px;text-align:center">
          <button class="btn" onclick="state.view='landing'; render();">뒤로가기</button>
        </div>
      </div>`;
  }
  else if (state.view === 'diff') {
    root.innerHTML = `
      <div class="landing">
        <h1>난이도 선택</h1>
        <div class="row">
          <button class="btn primary" onclick="startGame('쉬움')">쉬움 (기본 스탯/도구)</button>
          <button class="btn primary" onclick="startGame('보통')">보통 (랭크업/필드)</button>
          <button class="btn primary" onclick="startGame('어려움')">어려움 (랭크업+필드+상태이상)</button>
        </div>
        <div style="margin-top:20px">
          <button class="btn" onclick="state.view='landing'; render();">뒤로가기</button>
        </div>
      </div>`;
  }
  else if (state.view === 'game') {
    const qList = [
      "더 스피드가 빠른 포켓몬은?", 
      "물리공격력이 더 높은 포켓몬은?", 
      "특수공격력이 더 높은 포켓몬은?", 
      "물리내구(방어)가 더 높은 포켓몬은?",
      "1번 기술 사용 시 상대를 먼저 기절시키는 포켓몬은?"
    ];
    const qIdx = state.qIdx;
    
    root.innerHTML = `
      <div style="text-align:center"><b>[난이도: ${state.diff}]</b> ROUND ${state.round + 1} / 20 (점수: ${state.score})</div>
      <div class="title-q">${qList[qIdx]}</div>
      ${state.field ? `<div class="globalstate">현재 필드/날씨: ${state.field.n} (${state.field.e})</div>` : ''}
      <div class="board">
        ${renderCard(state.pA, 'A')}
        <div class="vs">VS</div>
        ${renderCard(state.pB, 'B')}
      </div>
      ${state.result ? `
        <div class="banner ${state.result.ok ? 'ok':'no'}">${state.result.ok ? '🎉 정답!':'❌ 오답!'}</div>
        <div class="explain">${state.result.msg}</div>
        <div style="text-align:center"><button class="btn primary" onclick="nextRound()">다음 문제</button></div>
      ` : ''}
    `;
  }
  else if (state.view === 'result') {
    root.innerHTML = `
      <div class="landing">
        <h1>게임 종료!</h1>
        <h2>20문제 중 ${state.score}문제를 맞혔습니다!</h2>
        <button class="btn primary" onclick="state.view='diff'; render();">난이도 선택으로 돌아가기</button>
      </div>`;
  }
}

function renderCard(unit, side) {
  const p = unit.pkm;
  const ev = unit.role.ev;
  const rankStr = Object.entries(unit.rankUp).filter(([,v])=>v).map(([k,v])=>`${k}+${v}`).join(", ");
  
  return `
    <div class="card" onclick="choose('${side}')">
      <h2>${p.name} <span style="font-size:13px;color:#fff">(${p.types.join("/")})</span></h2>
      <div class="mid">
        <img src="${p.imageUrl}" alt="${p.name}">
        <div>
          <div class="stat"><b>HP</b><div class="bar ${ev.HP?'ev':''}"><i style="width:${(ev.HP/32)*100}%"></i></div><span>${ev.HP}</span></div>
          <div class="stat"><b>공격</b><div class="bar ${ev.공격?'ev':''}"><i style="width:${(ev.공격/32)*100}%"></i></div><span>${ev.공격}</span></div>
          <div class="stat"><b>방어</b><div class="bar ${ev.방어?'ev':''}"><i style="width:${(ev.방어/32)*100}%"></i></div><span>${ev.방어}</span></div>
          <div class="stat"><b>특공</b><div class="bar ${ev.특공?'ev':''}"><i style="width:${(ev.특공/32)*100}%"></i></div><span>${ev.특공}</span></div>
          <div class="stat"><b>특방</b><div class="bar ${ev.특방?'ev':''}"><i style="width:${(ev.특방/32)*100}%"></i></div><span>${ev.특방}</span></div>
          <div class="stat"><b>스피드</b><div class="bar ${ev.스피드?'ev':''}"><i style="width:${(ev.스피드/32)*100}%"></i></div><span>${ev.스피드}</span></div>
        </div>
      </div>
      <div class="info">
        성격 <span>${unit.nature}</span> · 도구 <span>${unit.item.n}</span><br/>
        ${rankStr ? `랭크업 <span>${rankStr}</span><br/>` : ''}
        ${unit.status ? `상태이상 <span style="color:#ff6b6b">${unit.status.n}</span>` : ''}
      </div>
      <div class="moves">
        ${unit.moves.slice(0,4).map((m,i)=>`<div class="mv ${i===0?'first':''}">${i===0?'① ':''}${m}</div>`).join('')}
      </div>
    </div>`;
}

function startGame(diff) {
  state.diff = diff;
  state.round = 0;
  state.score = 0;
  state.view = 'game';
  initRound();
  render();
}

function choose(side) {
  if (state.result) return;
  const qIdx = state.qIdx;
  let resA, resB;
  let label = "";
  let win = "A";
  let msg = "";

  if(qIdx < 4) {
    if(qIdx === 0) { label = "스피드"; resA = getSpeed(state.pA); resB = getSpeed(state.pB); }
    else if(qIdx === 1) { label = "물리공격"; resA = getAtk(state.pA, "공격"); resB = getAtk(state.pB, "공격"); }
    else if(qIdx === 2) { label = "특수공격"; resA = getAtk(state.pA, "특공"); resB = getAtk(state.pB, "특공"); }
    else { label = "물리내구(방어)"; resA = getDef(state.pA, "방어"); resB = getDef(state.pB, "방어"); }

    if(state.field?.n === "트릭룸" && qIdx === 0) {
      win = resA.val <= resB.val ? "A" : "B"; 
    } else {
      win = resA.val >= resB.val ? "A" : "B";
    }
    
    msg = `【A: ${state.pA.pkm.name}】\n${resA.log.join("\n")}\n▶ 최종 ${label}: ${resA.val}\n\n` +
          `【B: ${state.pB.pkm.name}】\n${resB.log.join("\n")}\n▶ 최종 ${label}: ${resB.val}\n\n` +
          `정답: ${win==='A' ? state.pA.pkm.name : state.pB.pkm.name}`;
          
  } else {
    const dA = damage(state.pA, state.pB);
    const dB = damage(state.pB, state.pA);
    const sA = getSpeed(state.pA).val;
    const sB = getSpeed(state.pB).val;
    const trick = state.field?.n === "트릭룸";
    const aFirst = trick ? sA <= sB : sA >= sB;
    
    if(aFirst) {
      win = dA.ko ? "A" : (dB.ko ? "B" : (dA.dmg >= dB.dmg ? "A" : "B"));
    } else {
      win = dB.ko ? "B" : (dA.ko ? "A" : (dB.dmg >= dA.dmg ? "B" : "A"));
    }

    msg = `공격 순서: ${aFirst ? "A 선공" : "B 선공"} (최종 스피드 A:${sA} vs B:${sB})\n\n` +
          `【A(${state.pA.pkm.name}) 공격 결과】\n${dA.lines.join("\n")}\n\n` +
          `【B(${state.pB.pkm.name}) 공격 결과】\n${dB.lines.join("\n")}\n\n` +
          `정답: ${win==='A' ? state.pA.pkm.name : state.pB.pkm.name}`;
  }

  const ok = side === win;
  if(ok) state.score++;

  state.result = { ok, msg };
  render();
}

function nextRound() {
  if (state.round + 1 >= 20) {
    state.view = 'result';
  } else {
    state.round++;
    initRound();
  }
  render();
}

render();
</script>
